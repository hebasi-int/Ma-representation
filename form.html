<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Booking</title>
    <link rel="stylesheet" href="form.css">
    <link rel="icon" href="logo.jpeg">
</head>
<body>
           
      <nav class="navbar">
         <div class="logo">Drive<span>Lux</span></div>

         <ul class="nav-links">
            <li><a href="home.html">Accueil</a></li>
            <li><a href="home.html">Voitures</a></li>
            <li><a href="home.html">Services</a></li>
            <li><a href="home.html">Contact</a></li>
         </ul>

         
      </nav>
       <div class="booking-card">
            <h2 class="form-title">Compléter vos données</h2>
            
            <form class="booking-form" novalidate>
                <div class="form-group">
                    <label>Nom complet *</label>
                    <input type="text" placeholder="Votre nom complet" required>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Email *</label>
                        <input type="email" placeholder="exemple@mail.com" required>
                    </div>
                    <div class="form-group">
                        <label>Téléphone *</label>
                        <input type="tel" placeholder="06XXXXXXXX" required>
                    </div>
                </div>

                <div class="form-group">
                    <label>Date de Prise</label>
                    <input type="date" placeholder="06XXXXXXXX" required>
                </div>
                <div class="form-group">
                    <label>Heure de Prise</label>
                    <input type="time" placeholder="06XXXXXXXX" required>
                </div>
                <div class="form-group">
                    <label>Date de Retour</label>
                    <input type="date" placeholder="06XXXXXXXX" required>
                </div>
                <div class="form-group">
                    <label>Heure de Retour</label>
                    <input type="time" placeholder="06XXXXXXXX" required>
                </div>



                <div class="form-group">
                    <label>Adresse *</label>
                    <input type="text" placeholder="Votre adresse actuelle" required >
                </div>


                

                <button type="submit" class="btn-reserve">Réserver</button>
            </form>
        </div>
        <footer class="footer">

         <div class="footer-container">

            
            <div class="footer-box">
                  <h2>Drive<span>Lux</span></h2>
                  <p>Luxury in Every Ride</p>
            </div>

            
            <div class="footer-box">
                  <h3>Quick Links</h3>
                  <a href="#">Accueil</a>
                  <a href="#">Voitures</a>
                  <a href="#">Services</a>
                  <a href="#">Contact</a>
            </div>

            
            <div class="footer-box">
                  <h3>Contact</h3>
                  <p>📍 Agadir, Morocco</p>
                  <p>📞 +212 6 00 00 00 00</p>
                  <p>📧 drivelux@gmail.com</p>
            </div>

            
            <div class="footer-box">
                  <h3>Follow Us</h3>
                  <div class="socials">
                     <i class="fab fa-facebook"></i>
                     <i class="fab fa-instagram"></i>
                     <i class="fab fa-whatsapp"></i>
                  </div>
            </div>

         </div>

      </footer>
